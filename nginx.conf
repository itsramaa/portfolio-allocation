# Upstream to bypass ISP DNS Poisoning (Internet Positif)
upstream binance_backend {
    server 108.158.2.161:443 max_fails=3 fail_timeout=10s;
    server 18.64.21.130:443 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy /binance to Binance API
    location ^~ /binance/ {
        proxy_pass https://binance_backend/;
        proxy_ssl_server_name on;
        proxy_ssl_name api.binance.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host api.binance.com;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Reverse proxy /bapi to Binance Alpha API (www.binance.com)
    location ^~ /bapi/ {
        proxy_pass https://binance_backend/;
        proxy_ssl_server_name on;
        proxy_ssl_name www.binance.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host www.binance.com;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Reverse proxy /fapi to Binance USDT-M Futures API
    location ^~ /fapi/ {
        proxy_pass https://binance_backend/;
        proxy_ssl_server_name on;
        proxy_ssl_name fapi.binance.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host fapi.binance.com;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Reverse proxy /dapi to Binance COIN-M Futures API
    location ^~ /dapi/ {
        proxy_pass https://binance_backend/;
        proxy_ssl_server_name on;
        proxy_ssl_name dapi.binance.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host dapi.binance.com;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for all routes
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
