services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: portfolio-allocation-api:latest
    container_name: portfolio-allocation-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3001
      DATA_DIR: /app/data
      DB_PATH: /app/data/portfolio.db
      NODE_ENV: production
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}
      VITE_BINANCE_API_KEY: ${VITE_BINANCE_API_KEY}
      VITE_BINANCE_API_SECRET: ${VITE_BINANCE_API_SECRET}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY}
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL}
      NARRATIVE_COINGECKO_MARKET_IDS: ${NARRATIVE_COINGECKO_MARKET_IDS}
      ALTERNATIVE_ME_FEAR_GREED_URL: ${ALTERNATIVE_ME_FEAR_GREED_URL}
      NARRATIVE_BINANCE_BASE_URL: ${NARRATIVE_BINANCE_BASE_URL}
      REDDIT_RSS_URL: ${REDDIT_RSS_URL}
      NARRATIVE_RSS_FEEDS: ${NARRATIVE_RSS_FEEDS}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL}
      BASE_RPC_URL: ${BASE_RPC_URL}
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      BITCOIN_API_URL: ${BITCOIN_API_URL}
      NARRATIVE_ASSET_ALIASES: ${NARRATIVE_ASSET_ALIASES}
      NARRATIVE_ALIASES: ${NARRATIVE_ALIASES}
      NARRATIVE_ONCHAIN_CHAINS: ${NARRATIVE_ONCHAIN_CHAINS}
      NARRATIVE_HTTP_TIMEOUT_SEC: ${NARRATIVE_HTTP_TIMEOUT_SEC}
      NARRATIVE_CACHE_MINUTES: ${NARRATIVE_CACHE_MINUTES}
      NARRATIVE_REFRESH_MINUTES: ${NARRATIVE_REFRESH_MINUTES}
      NARRATIVE_HISTORY_RETENTION_DAYS: ${NARRATIVE_HISTORY_RETENTION_DAYS}
      NARRATIVE_MARKET_WEIGHT: ${NARRATIVE_MARKET_WEIGHT}
      NARRATIVE_VOLUME_WEIGHT: ${NARRATIVE_VOLUME_WEIGHT}
      NARRATIVE_SOCIAL_WEIGHT: ${NARRATIVE_SOCIAL_WEIGHT}
      NARRATIVE_ONCHAIN_WEIGHT: ${NARRATIVE_ONCHAIN_WEIGHT}
      NARRATIVE_CATALYST_WEIGHT: ${NARRATIVE_CATALYST_WEIGHT}
      NARRATIVE_CROWDED_THRESHOLD: ${NARRATIVE_CROWDED_THRESHOLD}
      NARRATIVE_GROWING_THRESHOLD: ${NARRATIVE_GROWING_THRESHOLD}
      NARRATIVE_DIRECTION_THRESHOLD: ${NARRATIVE_DIRECTION_THRESHOLD}
      NARRATIVE_SCORE_BASE: ${NARRATIVE_SCORE_BASE}
      NARRATIVE_SCORE_SCALE: ${NARRATIVE_SCORE_SCALE}
      LUNARCRUSH_ENABLED: ${LUNARCRUSH_ENABLED}
      LUNARCRUSH_API_KEY: ${LUNARCRUSH_API_KEY}
      LUNARCRUSH_BASE_URL: ${LUNARCRUSH_BASE_URL}
      LUNARCRUSH_ENDPOINT_TEMPLATE: ${LUNARCRUSH_ENDPOINT_TEMPLATE}
      LUNARCRUSH_AUTH_HEADER: ${LUNARCRUSH_AUTH_HEADER}
      LUNARCRUSH_SOCIAL_SCORE_PATH: ${LUNARCRUSH_SOCIAL_SCORE_PATH}
      LUNARCRUSH_MENTIONS_PATH: ${LUNARCRUSH_MENTIONS_PATH}
      LUNARCRUSH_ENGAGEMENT_PATH: ${LUNARCRUSH_ENGAGEMENT_PATH}
      LUNARCRUSH_MENTIONS_BASELINE: ${LUNARCRUSH_MENTIONS_BASELINE}
      LUNARCRUSH_ENGAGEMENT_BASELINE: ${LUNARCRUSH_ENGAGEMENT_BASELINE}
      COINGLASS_ENABLED: ${COINGLASS_ENABLED}
      COINGLASS_API_KEY: ${COINGLASS_API_KEY}
      COINGLASS_BASE_URL: ${COINGLASS_BASE_URL}
      COINGLASS_ENDPOINT_TEMPLATE: ${COINGLASS_ENDPOINT_TEMPLATE}
      COINGLASS_AUTH_HEADER: ${COINGLASS_AUTH_HEADER}
      COINGLASS_OPEN_INTEREST_PATH: ${COINGLASS_OPEN_INTEREST_PATH}
      COINGLASS_FUNDING_RATE_PATH: ${COINGLASS_FUNDING_RATE_PATH}
      COINGLASS_LIQUIDATIONS_PATH: ${COINGLASS_LIQUIDATIONS_PATH}
      COINGLASS_OPEN_INTEREST_BASELINE: ${COINGLASS_OPEN_INTEREST_BASELINE}
      COINGLASS_FUNDING_RATE_BASELINE: ${COINGLASS_FUNDING_RATE_BASELINE}
      COINGLASS_LIQUIDATIONS_BASELINE: ${COINGLASS_LIQUIDATIONS_BASELINE}
      CRYPTOQUANT_ENABLED: ${CRYPTOQUANT_ENABLED}
      CRYPTOQUANT_API_KEY: ${CRYPTOQUANT_API_KEY}
      CRYPTOQUANT_BASE_URL: ${CRYPTOQUANT_BASE_URL}
      CRYPTOQUANT_ENDPOINT_TEMPLATE: ${CRYPTOQUANT_ENDPOINT_TEMPLATE}
      CRYPTOQUANT_EXCHANGE_FLOW_ENDPOINT_TEMPLATE: ${CRYPTOQUANT_EXCHANGE_FLOW_ENDPOINT_TEMPLATE}
      CRYPTOQUANT_RESERVE_ENDPOINT_TEMPLATE: ${CRYPTOQUANT_RESERVE_ENDPOINT_TEMPLATE}
      CRYPTOQUANT_AUTH_HEADER: ${CRYPTOQUANT_AUTH_HEADER}
      CRYPTOQUANT_ACTIVE_ADDRESS_PATH: ${CRYPTOQUANT_ACTIVE_ADDRESS_PATH}
      CRYPTOQUANT_EXCHANGE_FLOW_PATH: ${CRYPTOQUANT_EXCHANGE_FLOW_PATH}
      CRYPTOQUANT_RESERVE_PATH: ${CRYPTOQUANT_RESERVE_PATH}
      CRYPTOQUANT_ACTIVE_ADDRESS_BASELINE: ${CRYPTOQUANT_ACTIVE_ADDRESS_BASELINE}
      CRYPTOQUANT_EXCHANGE_FLOW_BASELINE: ${CRYPTOQUANT_EXCHANGE_FLOW_BASELINE}
      CRYPTOQUANT_RESERVE_BASELINE: ${CRYPTOQUANT_RESERVE_BASELINE}
    volumes:
      - ./server/data:/app/data
    extra_hosts:
      - "api.binance.com:108.158.2.161"
      - "www.binance.com:108.158.2.161"
      - "fapi.binance.com:108.158.2.161"
      - "dapi.binance.com:108.158.2.161"
    expose:
      - "3001"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BINANCE_API_KEY: ${VITE_BINANCE_API_KEY}
        VITE_BINANCE_API_SECRET: ${VITE_BINANCE_API_SECRET}
    image: portfolio-allocation:latest
    container_name: portfolio-allocation
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "0.0.0.0:3000:80"
    extra_hosts:
      - "api.binance.com:108.158.2.161"
      - "www.binance.com:108.158.2.161"
      - "fapi.binance.com:108.158.2.161"
      - "dapi.binance.com:108.158.2.161"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
