services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-allocation:latest
    container_name: portfolio-allocation
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
